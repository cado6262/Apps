name: NextCooking

options:
  bundleIdPrefix: com.nextcooking
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

targets:
  NextCooking:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS/NextCooking
        excludes:
          - "*.plist"
          - "*.entitlements"
    info:
      path: iOS/NextCooking/Info.plist
      properties:
        NSHealthShareUsageDescription: "Next Cooking importiert deine Tagesmakros aus Apple Health, um passende Rezepte vorzuschlagen."
        NSCameraUsageDescription: "Next Cooking kann die Kamera nutzen, um Barcodes von Lebensmitteln zu scannen."
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: iOS/NextCooking/NextCooking.entitlements
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.nextcooking.app
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
